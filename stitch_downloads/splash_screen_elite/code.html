<script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            const percentageText = document.getElementById('loading-percentage');
            const loadingText = document.getElementById('loading-text');
            
            let progress = 0;
            const stages = [
                "Initializing Guru AI...",
                "Syncing Academic Core...",
                "Loading Ranker Insights...",
                "Optimizing Workspace...",
                "Elite Access Granted"
            ];

            const interval = setInterval(() => {
                progress += Math.random() * 8;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    loadingText.innerText = stages[stages.length - 1];
                    loadingText.classList.add('text-primary');
                    
                    // Simulation of transition to main app
                    setTimeout(() => {
                        document.body.classList.add('opacity-0', 'transition-opacity', 'duration-1000');
                    }, 500);
                } else {
                    // Update Stage Text
                    const stageIndex = Math.floor((progress / 100) * (stages.length - 1));
                    loadingText.innerText = stages[stageIndex];
                }

                progressBar.style.width = `${progress}%`;
                percentageText.innerText = `${Math.floor(progress)}%`;
            }, 150);
        });
    </script>
